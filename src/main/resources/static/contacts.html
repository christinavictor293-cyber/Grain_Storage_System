<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Contacts — Grain Storage</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-success">
  <div class="container-fluid">
    <a class="navbar-brand" href="dashboard.html">🌾 Grain Storage</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link active" href="contacts.html">Contacts</a></li>
        <li class="nav-item"><a class="nav-link" href="grain-lots.html">Grain Lots</a></li>
        <li class="nav-item"><a class="nav-link" href="vendor-bills.html">Vendor Bills</a></li>
        <li class="nav-item"><a class="nav-link" href="sales-orders.html">Sales Orders</a></li>
        <li class="nav-item"><a class="nav-link" href="customer-invoices.html">Customer Invoices</a></li>
        <li class="nav-item"><a class="nav-link" href="budgets.html">Budgets</a></li>
        <li class="nav-item"><a class="nav-link" href="reports.html">Reports</a></li>
      </ul>
      <span class="navbar-text text-white me-3" id="navUser"></span>
      <button class="btn btn-outline-light btn-sm" onclick="logout()">Logout</button>
    </div>
  </div>
</nav>

<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-2">
    <h4>Contacts</h4>
    <button class="btn btn-success btn-sm" data-bs-toggle="modal" data-bs-target="#contactModal">+ New Contact</button>
  </div>
  <table class="table table-bordered table-hover">
    <thead class="table-dark">
      <tr><th>Name</th><th>Type</th><th>Phone</th><th>Address</th></tr>
    </thead>
    <tbody id="contactTable"></tbody>
  </table>
</div>

<!-- New Contact Modal -->
<div class="modal fade" id="contactModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">New Contact</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <div id="modalAlert" class="alert alert-danger d-none"></div>
        <form id="contactForm">
          <div class="mb-3"><label class="form-label">Name</label><input type="text" id="cName" class="form-control" required/></div>
          <div class="mb-3">
            <label class="form-label">Type</label>
            <select id="cType" class="form-select" required>
              <option value="VENDOR">VENDOR</option>
              <option value="CUSTOMER">CUSTOMER</option>
            </select>
          </div>
          <div class="mb-3"><label class="form-label">Phone</label><input type="text" id="cPhone" class="form-control"/></div>
          <div class="mb-3"><label class="form-label">Address</label><input type="text" id="cAddress" class="form-control"/></div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-success" id="saveContact">Save</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/contacts.js"></script>
</body>
</html>
